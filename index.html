<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Clock Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
  /* Layout: top bar (mode switch + theme toggle) over a two-column view. Clock view = analog clock + month grid.
     Pomodoro view = progress ring + controls. Phones stack to one column and fill the embed height exactly. */
  :root {
    --bg: #ffffff;
    --surface-2: #f2f2f7;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --border: rgba(60, 60, 67, 0.14);
    --track: #e5e5ea;
    --accent: #1c1c1e;
    --accent-text: #ffffff;
    --face: #f2f2f7;
    --red: #ff3b30;
    --red-soft: rgba(255, 59, 48, 0.10);
    --orange: #ff9500;
    --orange-soft: rgba(255, 149, 0, 0.16);
    --green: #34c759;
    --green-soft: rgba(52, 199, 89, 0.16);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --font-num: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2b2b2d;
      --surface-2: #343436;
      --text: #f2f2f7;
      --muted: #98989d;
      --border: rgba(255, 255, 255, 0.10);
      --track: #3d3d40;
      --accent: #f2f2f7;
      --accent-text: #2b2b2d;
      --face: #1c1c1e;
      --red: #ff453a;
      --red-soft: rgba(255, 69, 58, 0.16);
      --orange: #ff9f0a;
      --orange-soft: rgba(255, 159, 10, 0.20);
      --green: #30d158;
      --green-soft: rgba(48, 209, 88, 0.20);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2b2b2d;
    --surface-2: #343436;
    --text: #f2f2f7;
    --muted: #98989d;
    --border: rgba(255, 255, 255, 0.10);
    --track: #3d3d40;
    --accent: #f2f2f7;
    --accent-text: #2b2b2d;
    --face: #1c1c1e;
    --red: #ff453a;
    --red-soft: rgba(255, 69, 58, 0.16);
    --orange: #ff9f0a;
    --orange-soft: rgba(255, 159, 10, 0.20);
    --green: #30d158;
    --green-soft: rgba(48, 209, 88, 0.20);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* Edge-to-edge: no outer margin, border, radius or shadow, so it blends into the Notion page. */
  .app { min-height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 14px; }
  .bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

  /* Segmented control (mode switch and pomodoro phase tabs) */
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 10px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    height: 28px; padding: 0 12px; border-radius: 8px; font-size: .8rem; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, 0.06); }
  .rbtn {
    position: relative; width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0;
    background: var(--surface-2); color: var(--muted); cursor: pointer; display: grid; place-items: center;
    transition: background .15s, color .15s;
  }
  .rbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rbtn:hover { color: var(--text); background: var(--track); }
  .run-dot { position: absolute; top: 0; right: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 2px var(--bg); }

  .view { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.15fr; gap: 24px; align-items: center; }
  .view > section, .view > div { min-width: 0; }

  /* ---------- Clock view (iPhone style: analog clock on the left, calendar on the right at every width) ---------- */
  .clock-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .analog { width: min(100%, 220px); aspect-ratio: 1; }
  /* iPhone analog widget: no face or frame, numerals and ticks sit straight on the widget background. */
  .tick { stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; opacity: .55; }
  .tick.major { stroke: var(--text); stroke-width: 2; opacity: .9; }
  .num { font-family: var(--font-num); font-size: 21px; font-weight: 600; fill: var(--text); text-anchor: middle; dominant-baseline: central; }
  .hand { stroke-linecap: round; }
  .hand.h { stroke: var(--text); stroke-width: 7; }
  .hand.m { stroke: var(--text); stroke-width: 5; }
  .hand.s { stroke: var(--orange); stroke-width: 2; }
  .pivot { fill: var(--orange); }
  .pivot-in { fill: var(--bg); }
  .digital { text-align: center; }
  .time { font-family: var(--font-num); font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .time small { font-size: .85rem; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .date { margin-top: 4px; font-size: .85rem; color: var(--muted); display: flex; gap: 6px; justify-content: center; align-items: baseline; flex-wrap: wrap; }
  .wk { color: var(--red); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: .75rem; }
  .dts { display: none; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
  .cal-title { font-family: var(--font-num); font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }
  .cal-title span { color: var(--red); font-weight: 600; font-size: .9rem; margin-left: 6px; letter-spacing: 0; }
  .nav { display: flex; align-items: center; gap: 2px; }
  .nav button {
    border: 0; background: transparent; color: var(--red); border-radius: 999px; height: 30px; min-width: 30px;
    padding: 0 8px; cursor: pointer; font-size: 1.25rem; line-height: 1; transition: background .15s;
  }
  .nav #todayBtn { font-size: .85rem; font-weight: 500; padding: 0 10px; }
  .nav button:hover { background: var(--red-soft); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .dow { font-size: .72rem; font-weight: 600; color: var(--muted); padding: 4px 0 6px; }
  .day { font-family: var(--font-num); aspect-ratio: 1.2; display: grid; place-items: center; font-size: .95rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .day span { display: grid; place-items: center; width: 2em; height: 2em; border-radius: 50%; line-height: 1; }
  .day.out { color: var(--muted); opacity: .4; }
  .day.today span { background: var(--red); color: #fff; font-weight: 700; }
  .day:not(.today):not(.out):hover span { background: var(--surface-2); }

  /* ---------- Pomodoro view (iPhone Timer style) ---------- */
  .ring-wrap { display: flex; justify-content: center; align-items: center; min-height: 0; }
  .ring-box { position: relative; width: min(100%, 230px); aspect-ratio: 1; }
  .ring-box svg { display: block; width: 100%; height: 100%; }
  .ring-bg { fill: none; stroke: var(--track); stroke-width: 7; }
  .ring-fg { fill: none; stroke: var(--orange); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .2s; }
  .ring-box.brk .ring-fg { stroke: var(--green); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .p-time { font-family: var(--font-num); font-size: 2.9rem; font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .p-label { font-size: .85rem; color: var(--muted); }
  .ring-box.done { animation: pulse 0.6s ease-in-out 3; }
  @keyframes pulse { 50% { transform: scale(1.04); } }

  .p-side { display: flex; flex-direction: column; gap: 16px; }
  .tabs { display: flex; }
  .tabs button { flex: 1; padding: 0 6px; }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; }
  .circle {
    position: relative; flex: none; width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; font-size: .88rem; font-weight: 500; transition: opacity .15s;
  }
  .circle::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .2; pointer-events: none; }
  .circle:hover { opacity: .85; }
  #pReset { background: var(--surface-2); color: var(--text); }
  .circle.primary { background: var(--green-soft); color: var(--green); }
  .circle.primary.pause { background: var(--orange-soft); color: var(--orange); }
  .mini-group { display: flex; gap: 10px; }
  .mini { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text); cursor: pointer; display: grid; place-items: center; transition: opacity .15s; }
  .mini:hover { opacity: .8; }
  .mini svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mini.off { color: var(--muted); }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .sessions { display: flex; align-items: center; gap: 8px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--track); display: block; }
  .dots i.on { background: var(--orange); }
  .step { display: flex; align-items: center; gap: 8px; }
  .step output { color: var(--text); font-variant-numeric: tabular-nums; }
  .stepper { display: flex; background: var(--surface-2); border-radius: 9px; }
  .stepper button { width: 36px; height: 28px; border: 0; background: transparent; color: var(--text); font-size: 1.1rem; line-height: 1; cursor: pointer; border-radius: 9px 0 0 9px; transition: background .15s; }
  .stepper button + button { border-left: 1px solid var(--border); border-radius: 0 9px 9px 0; }
  .stepper button:hover { background: var(--track); }

  @media (prefers-reduced-motion: reduce) { .ring-box.done { animation: none; } .ring-fg { transition: none; } }

  /* ---------- Phones: compact, fills the embed height so nothing scrolls ---------- */
  @media (max-width: 560px) {
    html, body { overflow: hidden; }
    .app { height: 100%; min-height: 300px; padding: 8px 14px 10px; gap: 6px; }
    .view-pomo { grid-template-columns: 1fr; gap: 8px; }
    .rbtn { width: 32px; height: 32px; }
    .seg button { height: 32px; }

    /* Clock stays on the left and the calendar on the right, like a medium iPhone widget. */
    /* Content-sized and pinned right under the header; the calendar is exactly as tall as the clock column. */
    .view-clock { flex: none; margin-block: 0 auto; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); grid-template-rows: auto; align-items: stretch; gap: 12px; }
    .clock-wrap { gap: 8px; justify-content: center; }
    .analog { width: 100%; max-width: 150px; }
    .time { font-size: 1.05rem; }
    .time small { font-size: .6rem; margin-left: 2px; }
    .date { font-size: .7rem; gap: 4px; margin-top: 2px; }
    .wk { font-size: .62rem; }
    .dtl { display: none; }
    .dts { display: inline; }
    .view-clock > section:last-child { align-self: stretch; display: flex; flex-direction: column; min-height: 0; }
    .cal-head { margin-bottom: 2px; }
    .cal-title { font-size: .95rem; }
    .cal-title span { font-size: .62rem; margin-left: 3px; }
    .nav { gap: 0; }
    .nav button { height: 28px; min-width: 22px; padding: 0 2px; font-size: 1.15rem; }
    .nav #todayBtn { font-size: .7rem; padding: 0 5px; }
    .grid { flex: 1; min-height: 0; grid-template-rows: auto repeat(6, minmax(24px, 1fr)); }
    .dow { padding: 2px 0; font-size: .62rem; }
    .day { aspect-ratio: auto; font-size: .78rem; }
    .day span { width: 1.8em; height: 1.8em; }

    .view-pomo { display: flex; flex-direction: column; align-items: stretch; }
    .ring-wrap { flex: 1; }
    .ring-box { width: auto; height: 100%; max-height: 240px; max-width: 100%; }
    .p-time { font-size: min(2rem, 8vh); }
    .p-label { font-size: .75rem; }
    .p-side { gap: 10px; flex: none; }
    .controls { padding: 0 4px; }
    .circle { width: 50px; height: 50px; font-size: .78rem; }
    .mini { width: 34px; height: 34px; }
  }
  @media (max-width: 370px) { .cal-title span { display: none; } }
  @media (max-width: 560px) and (hover: none) { .day:not(.today):not(.out):hover { background: transparent; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="bar">
    <button type="button" class="rbtn" id="mToggle" aria-label="Switch to Pomodoro timer" title="Pomodoro">
      <svg id="icPomo" viewBox="0 0 24 24"><line x1="10" y1="2" x2="14" y2="2"/><line x1="12" y1="14" x2="15" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
      <svg id="icClock" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <i class="run-dot" id="runDot" hidden></i>
    </button>
    <button type="button" class="rbtn" id="toggle" title="Toggle light / dark" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </header>

  <section class="view view-clock" id="viewClock">
    <div class="clock-wrap">
      <svg class="analog" viewBox="0 0 200 200" aria-hidden="true">
        <g id="ticks"></g>
        <g id="nums"></g>
        <line class="hand h" id="hh" x1="100" y1="100" x2="100" y2="60"/>
        <line class="hand m" id="mh" x1="100" y1="100" x2="100" y2="38"/>
        <line class="hand s" id="sh" x1="100" y1="114" x2="100" y2="22"/>
        <circle class="pivot" cx="100" cy="100" r="5"/>
        <circle class="pivot-in" cx="100" cy="100" r="1.8"/>
      </svg>
      <div class="digital">
        <div class="time" id="time">--:--:--</div>
        <div class="date"><span class="wk" id="wk"></span><span class="dtl" id="dtl"></span><span class="dts" id="dts"></span></div>
      </div>
    </div>
    <section>
      <div class="cal-head">
        <div class="cal-title" id="calTitle"></div>
        <div class="nav">
          <button type="button" id="prev" aria-label="Previous month">‹</button>
          <button type="button" id="todayBtn">Today</button>
          <button type="button" id="next" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </section>

  <section class="view view-pomo" id="viewPomo" hidden>
    <div class="ring-wrap">
      <div class="ring-box" id="ringBox">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-bg" cx="100" cy="100" r="90"/>
          <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="90" transform="rotate(-90 100 100)"/>
        </svg>
        <div class="ring-center">
          <div class="p-time" id="pTime" role="timer">25:00</div>
          <div class="p-label" id="pLabel">Focus</div>
        </div>
      </div>
    </div>
    <div class="p-side">
      <div class="seg tabs" role="group" aria-label="Session type">
        <button type="button" data-pm="focus" aria-pressed="true">Focus</button>
        <button type="button" data-pm="short" aria-pressed="false">Short break</button>
        <button type="button" data-pm="long" aria-pressed="false">Long break</button>
      </div>
      <div class="controls">
        <button type="button" class="circle" id="pReset" aria-label="Reset timer">Reset</button>
        <div class="mini-group">
          <button type="button" class="mini" id="pSkip" aria-label="Skip to next session" title="Skip"><svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
          <button type="button" class="mini" id="pSound" aria-label="Sound" title="Sound"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><line id="soundOff" x1="3" y1="3" x2="21" y2="21"/></svg></button>
        </div>
        <button type="button" class="circle primary" id="pStart">Start</button>
      </div>
      <div class="meta">
        <div class="sessions"><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><span id="pToday">0 today</span></div>
        <div class="step">
          <output id="durVal">25 min</output>
          <div class="stepper">
            <button type="button" id="durMinus" aria-label="Shorter">−</button>
            <button type="button" id="durPlus" aria-label="Longer">+</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---------- Theme: follows the system unless toggled (or ?theme=dark|light)
  var root = document.documentElement;
  var params = new URLSearchParams(location.search);
  var forcedTheme = params.get('theme') || lsGet('cc-theme');
  if (forcedTheme === 'dark' || forcedTheme === 'light') root.setAttribute('data-theme', forcedTheme);
  $('toggle').onclick = function () {
    var isDark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    lsSet('cc-theme', next);
  };

  // ---------- Clock
  var NS = 'http://www.w3.org/2000/svg';
  var ticks = $('ticks'), nums = $('nums');
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0, a = i * 6 * Math.PI / 180;
    var r1 = major ? 90 : 92, r2 = 97;
    var l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 100 + r1 * Math.sin(a)); l.setAttribute('y1', 100 - r1 * Math.cos(a));
    l.setAttribute('x2', 100 + r2 * Math.sin(a)); l.setAttribute('y2', 100 - r2 * Math.cos(a));
    l.setAttribute('class', 'tick' + (major ? ' major' : ''));
    ticks.appendChild(l);
  }
  for (var k = 1; k <= 12; k++) {
    var ak = k * 30 * Math.PI / 180, t = document.createElementNS(NS, 'text');
    t.setAttribute('x', (100 + 75 * Math.sin(ak)).toFixed(2));
    t.setAttribute('y', (100 - 75 * Math.cos(ak)).toFixed(2));
    t.setAttribute('class', 'num');
    t.textContent = k;
    nums.appendChild(t);
  }
  var hh = $('hh'), mh = $('mh'), sh = $('sh'), timeEl = $('time');
  var wkEl = $('wk'), dtlEl = $('dtl'), dtsEl = $('dts');
  function rot(el, deg) { el.setAttribute('transform', 'rotate(' + deg + ' 100 100)'); }

  var viewY, viewM, lastDay = -1, lastSec = -1;
  var gridEl = $('grid'), titleEl = $('calTitle');
  var DOW = ['M','T','W','T','F','S','S'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function renderCal() {
    var now = new Date(), html = '';
    DOW.forEach(function (d) { html += '<div class="dow">' + d + '</div>'; });
    var offset = (new Date(viewY, viewM, 1).getDay() + 6) % 7;
    var start = new Date(viewY, viewM, 1 - offset);
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var cls = 'day';
      if (d.getMonth() !== viewM) cls += ' out';
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) cls += ' today';
      html += '<div class="' + cls + '"><span>' + d.getDate() + '</span></div>';
    }
    gridEl.innerHTML = html;
    titleEl.innerHTML = MONTHS[viewM] + '<span>' + viewY + '</span>';
  }
  function goToday() { var n = new Date(); viewY = n.getFullYear(); viewM = n.getMonth(); renderCal(); }
  function shift(n) { var d = new Date(viewY, viewM + n, 1); viewY = d.getFullYear(); viewM = d.getMonth(); renderCal(); }
  $('prev').onclick = function () { shift(-1); };
  $('next').onclick = function () { shift(1); };
  $('todayBtn').onclick = goToday;

  var raf = 0;
  function clockFrame() {
    var n = new Date(), h = n.getHours(), m = n.getMinutes(), s = n.getSeconds(), ms = n.getMilliseconds();
    rot(sh, (s + ms / 1000) * 6);
    rot(mh, (m + s / 60) * 6);
    rot(hh, ((h % 12) + m / 60) * 30);
    if (s !== lastSec) {
      lastSec = s;
      timeEl.innerHTML = (h % 12 || 12) + ':' + pad(m) + ':' + pad(s) + '<small>' + (h >= 12 ? 'PM' : 'AM') + '</small>';
      wkEl.textContent = n.toLocaleDateString(undefined, { weekday: 'long' });
      dtlEl.textContent = n.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
      dtsEl.textContent = n.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    if (n.getDate() !== lastDay) { lastDay = n.getDate(); renderCal(); }
    raf = requestAnimationFrame(clockFrame);
  }

  // ---------- Pomodoro
  var NAMES = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  var KEY = 'cc-pomo';
  var todayStr = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  function fresh() {
    return { mode: 'focus', dur: { focus: 25, short: 5, long: 15 }, running: false, endAt: 0, left: 25 * 60, cycle: 0, day: todayStr(), done: 0, sound: true };
  }
  function clampMin(v, d) { v = Math.round(Number(v)); return isFinite(v) && v >= 1 && v <= 120 ? v : d; }
  var S = fresh();
  (function load() {
    var raw = lsGet(KEY); if (!raw) return;
    try {
      var o = JSON.parse(raw);
      if (NAMES[o.mode]) S.mode = o.mode;
      S.dur.focus = clampMin(o.dur && o.dur.focus, 25);
      S.dur.short = clampMin(o.dur && o.dur.short, 5);
      S.dur.long = clampMin(o.dur && o.dur.long, 15);
      S.running = !!o.running && +o.endAt > 0;
      S.endAt = +o.endAt || 0;
      S.left = Math.max(0, Math.min(+o.left || S.dur[S.mode] * 60, S.dur[S.mode] * 60));
      S.cycle = Math.max(0, Math.min(4, +o.cycle || 0));
      S.day = o.day || todayStr(); S.done = Math.max(0, +o.done || 0);
      S.sound = o.sound !== false;
    } catch (e) { S = fresh(); }
  })();
  function save() { lsSet(KEY, JSON.stringify(S)); }

  var ac = null;
  function audio() {
    try {
      if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  document.addEventListener('pointerdown', audio, { once: true });
  function beep() {
    if (!S.sound || !ac) return;
    try {
      var t = ac.currentTime;
      [0, 0.22, 0.44].forEach(function (o, i) {
        var osc = ac.createOscillator(), g = ac.createGain();
        osc.type = 'sine'; osc.frequency.value = i === 2 ? 1046 : 784;
        g.gain.setValueAtTime(0.0001, t + o);
        g.gain.exponentialRampToValueAtTime(0.25, t + o + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.2);
        osc.connect(g); g.connect(ac.destination);
        osc.start(t + o); osc.stop(t + o + 0.22);
      });
    } catch (e) {}
  }

  function remaining() { return S.running ? Math.max(0, Math.ceil((S.endAt - Date.now()) / 1000)) : S.left; }
  function setMode(m) { S.mode = m; S.running = false; S.left = S.dur[m] * 60; save(); renderPomo(); }
  function rollDay() { if (S.day !== todayStr()) { S.day = todayStr(); S.done = 0; } }
  function advance(counted) {
    rollDay();
    var next;
    if (S.mode === 'focus') {
      if (counted) { S.cycle = Math.min(4, S.cycle + 1); S.done++; }
      next = S.cycle >= 4 ? 'long' : 'short';
    } else {
      if (S.mode === 'long') S.cycle = 0;
      next = 'focus';
    }
    setMode(next);
  }
  function complete() {
    beep();
    var box = $('ringBox'); box.classList.remove('done'); void box.offsetWidth; box.classList.add('done');
    setTimeout(function () { box.classList.remove('done'); }, 2000);
    advance(true);
  }
  function startStop() {
    audio();
    if (S.running) { S.left = remaining(); S.running = false; }
    else { if (S.left <= 0) S.left = S.dur[S.mode] * 60; S.endAt = Date.now() + S.left * 1000; S.running = true; }
    save(); renderPomo();
  }

  var CIRC = 2 * Math.PI * 90, ringFg = $('ringFg');
  ringFg.style.strokeDasharray = CIRC;
  function renderPomo() {
    rollDay();
    var rem = remaining(), total = S.dur[S.mode] * 60;
    $('pTime').textContent = pad(Math.floor(rem / 60)) + ':' + pad(rem % 60);
    $('pLabel').textContent = NAMES[S.mode] + (S.running ? '' : (rem < total ? ' · paused' : ''));
    ringFg.style.strokeDashoffset = CIRC * (1 - Math.max(0, Math.min(1, rem / total)));
    $('ringBox').classList.toggle('brk', S.mode !== 'focus');
    Array.prototype.forEach.call(document.querySelectorAll('[data-pm]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-pm') === S.mode ? 'true' : 'false');
    });
    $('pStart').textContent = S.running ? 'Pause' : (rem < total ? 'Resume' : 'Start');
    $('pStart').classList.toggle('pause', S.running);
    Array.prototype.forEach.call($('dots').children, function (d, i) { d.className = i < S.cycle ? 'on' : ''; });
    $('pToday').textContent = S.done + ' today';
    $('durVal').textContent = S.dur[S.mode] + ' min';
    $('soundOff').style.display = S.sound ? 'none' : '';
    $('pSound').classList.toggle('off', !S.sound);
    $('pSound').setAttribute('aria-pressed', S.sound ? 'true' : 'false');
    $('runDot').hidden = !(S.running && view !== 'pomo');
  }
  setInterval(function () {
    if (S.running && remaining() <= 0) { complete(); return; }
    renderPomo();
  }, 250);

  $('pStart').onclick = startStop;
  $('pReset').onclick = function () { S.running = false; S.left = S.dur[S.mode] * 60; save(); renderPomo(); };
  $('pSkip').onclick = function () { advance(false); };
  $('pSound').onclick = function () { S.sound = !S.sound; if (S.sound) audio(); save(); renderPomo(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-pm]'), function (b) {
    b.onclick = function () { setMode(b.getAttribute('data-pm')); };
  });
  function changeDur(dir) {
    // Snap to multiples of 5 (5, 10, 15 ...); the only value below 5 is 1 minute.
    var cur = S.dur[S.mode];
    var v = dir > 0 ? (Math.floor(cur / 5) + 1) * 5 : (Math.ceil(cur / 5) - 1) * 5;
    v = Math.max(1, Math.min(120, v));
    S.dur[S.mode] = v; S.running = false; S.left = v * 60; save(); renderPomo();
  }
  $('durMinus').onclick = function () { changeDur(-1); };
  $('durPlus').onclick = function () { changeDur(1); };

  // ---------- Mode switch (?mode=pomodoro opens the timer by default)
  var view = 'clock';
  function setView(v) {
    view = v;
    $('viewClock').hidden = v !== 'clock';
    $('viewPomo').hidden = v !== 'pomo';
    // One button: shows the icon of the mode it will switch to.
    $('icPomo').toggleAttribute('hidden', v !== 'clock');
    $('icClock').toggleAttribute('hidden', v === 'clock');
    var mt = $('mToggle');
    mt.setAttribute('aria-label', v === 'clock' ? 'Switch to Pomodoro timer' : 'Switch to clock');
    mt.title = v === 'clock' ? 'Pomodoro' : 'Clock';
    lsSet('cc-view', v);
    cancelAnimationFrame(raf);
    if (v === 'clock') clockFrame();
    renderPomo();
  }
  $('mToggle').onclick = function () { setView(view === 'clock' ? 'pomo' : 'clock'); };

  var qm = (params.get('mode') || '').toLowerCase();
  var startView = qm === 'pomodoro' || qm === 'pomo' ? 'pomo' : qm === 'clock' ? 'clock' : (lsGet('cc-view') === 'pomo' ? 'pomo' : 'clock');
  goToday();
  setView(startView);
})();
</script>

</body>
</html>
