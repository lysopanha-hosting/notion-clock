<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Clock, Calendar & Pomodoro</title>
<style>
  :root {
    /* iPhone widget look — dark palette (default) */
    --clock-bg: #000000;
    --card-bg: #1c1c1e;
    --card-border: rgba(255,255,255,.08);
    --card-shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    --text: #ffffff;
    --muted: rgba(235,235,245,.45);
    --tick: rgba(255,255,255,.28);
    --hand: #ffffff;
    --red: #ff453a;
    --green: #30d158;
    --orange: #ff9f0a;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Rounded", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .light {
    --clock-bg: #ffffff;
    --card-bg: #ffffff;
    --card-border: rgba(55,53,47,.12);
    --card-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.06);
    --text: #000000;
    --muted: rgba(60,60,67,.45);
    --tick: rgba(60,60,67,.3);
    --hand: #000000;
    --red: #ff3b30;
    --green: #34c759;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: transparent;
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
  }
  button { font-family: inherit; }

  /* Always two columns: clock LEFT, calendar / pomodoro RIGHT — on phone and desktop. Never stacks. */
  .wrap {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
    grid-template-rows: minmax(0, 1fr);
    gap: clamp(5px, 2.5vmin, 14px);
    padding: clamp(3px, 1.5vmin, 8px);
  }
  .card {
    container-type: size;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--card-border);
    border-radius: clamp(14px, 9vmin, 32px);
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }

  /* ---------- Clock ---------- */
  .clock { background: var(--clock-bg); display: grid; place-items: center; padding: clamp(4px, 3vmin, 14px); }
  .clock svg { width: 100%; height: 100%; display: block; }
  .num { fill: var(--text); font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-family: var(--font); }
  .hand { stroke: var(--hand); stroke-linecap: round; }
  .hand-s { stroke: var(--orange); stroke-linecap: round; }

  /* ---------- Right card (calendar / pomodoro) ---------- */
  .calcard { background: var(--card-bg); }
  .cal {
    --accent: var(--red);
    height: 100%;
    display: flex;
    flex-direction: column;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    padding: 5vmin;                 /* fallback */
    padding: min(6.5cqw, 6.5cqh);
    font-size: 3.6vmin;             /* fallback */
    font-size: min(5.2cqw, 4.6cqh);
  }
  .cal[data-mode="short"], .cal[data-mode="long"] { --accent: var(--green); }
  .cal[data-view="cal"]  .only-pomo { display: none !important; }
  .cal[data-view="pomo"] .only-cal  { display: none !important; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: .3em; margin-bottom: .4em; }
  .titlebox { min-width: 0; white-space: nowrap; overflow: hidden; }
  .month { font-size: 1.15em; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: .03em; cursor: pointer; }
  .year { color: var(--muted); font-weight: 600; margin-left: .4em; font-size: .85em; }
  @container (max-width: 230px) { .year { display: none; } }

  .tools { display: flex; align-items: center; gap: .05em; flex-shrink: 0; }
  .nav { display: flex; gap: .05em; }
  .ic {
    background: none; border: 0; color: var(--muted); font-size: 1.3em; line-height: 1;
    min-width: 22px; min-height: 22px; width: 1.55em; height: 1.55em;
    border-radius: 50%; cursor: pointer; touch-action: manipulation;
    display: grid; place-items: center;
    opacity: .75; transition: opacity .15s, background .15s;
  }
  .ic svg { width: 62%; height: 62%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .card:hover .ic { opacity: 1; }
  .ic:hover, .ic:active { background: rgba(127,127,127,.22); color: var(--text); opacity: 1; }

  /* Calendar */
  .calbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .dow, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow { font-size: .8em; font-weight: 600; color: var(--muted); text-align: center; margin-bottom: .25em; }
  .grid { flex: 1; min-height: 0; }
  .cell { display: flex; align-items: center; justify-content: center; min-height: 0; font-weight: 500; font-variant-numeric: tabular-nums; }
  .cell span { display: flex; align-items: center; justify-content: center; height: min(1.95em, 100%); aspect-ratio: 1 / 1; border-radius: 50%; }
  .cell.we { color: var(--muted); }
  .cell.today { color: #fff; font-weight: 700; }
  .cell.today span { background: var(--red); }

  /* Pomodoro */
  .chips { display: flex; gap: .25em; }
  .chips button {
    border: 0; background: rgba(127,127,127,.18); color: var(--muted);
    font-size: .8em; font-weight: 600; padding: .3em .65em; border-radius: 999px;
    cursor: pointer; touch-action: manipulation;
  }
  .chips button.on { background: var(--accent); color: #fff; }
  .pomo { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: .2em; }
  .ringrow { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; gap: .3em; }
  .ringwrap { flex: 1; min-width: 0; height: 100%; }
  .adj {
    border: 0; flex-shrink: 0; background: rgba(127,127,127,.2); color: var(--text);
    width: 2.3em; height: 2.3em; min-width: 28px; min-height: 28px; border-radius: 50%;
    font-size: .85em; font-weight: 700; font-variant-numeric: tabular-nums;
    cursor: pointer; touch-action: manipulation;
  }
  .adj:active { transform: scale(.94); }
  .adj:hover { background: rgba(127,127,127,.32); }
  .ringwrap svg { width: 100%; height: 100%; display: block; }
  .ring-track { fill: none; stroke: rgba(127,127,127,.22); stroke-width: 6; }
  .ring-prog { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke .3s; }
  .time { fill: var(--text); font-size: 19px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; font-family: var(--font); }
  .lbl { fill: var(--muted); font-size: 5.2px; font-weight: 700; letter-spacing: .1em; text-anchor: middle; font-family: var(--font); }
  .dot { fill: rgba(127,127,127,.3); }
  .dot.on { fill: var(--accent); }
  .ctrls { display: flex; align-items: center; justify-content: center; gap: .8em; flex-shrink: 0; }
  .cbtn {
    border: 0; width: 2.1em; height: 2.1em; min-width: 28px; min-height: 28px; border-radius: 50%;
    background: rgba(127,127,127,.2); color: var(--text); display: grid; place-items: center;
    cursor: pointer; touch-action: manipulation;
  }
  .cbtn svg { width: 46%; height: 46%; fill: currentColor; }
  .cbtn.main { width: 2.7em; height: 2.7em; min-width: 34px; min-height: 34px; background: var(--accent); color: #fff; }
  .cbtn:active { transform: scale(.94); }

  @media (max-width: 320px) { .wrap { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Clock (always left) -->
  <section class="card clock" aria-label="Analog clock">
    <svg viewBox="0 0 100 100" role="img" aria-label="Analog clock" preserveAspectRatio="xMidYMid meet">
      <g id="ticks"></g>
      <g id="nums"></g>
      <line id="hh" class="hand" x1="50" y1="56" x2="50" y2="27" stroke-width="4.2"/>
      <line id="mh" class="hand" x1="50" y1="56" x2="50" y2="12" stroke-width="3"/>
      <g id="sh"><line class="hand-s" x1="50" y1="62" x2="50" y2="10" stroke-width="1.1"/></g>
      <circle cx="50" cy="50" r="3.4" fill="var(--orange)"/>
      <circle cx="50" cy="50" r="1.3" fill="var(--clock-bg)"/>
    </svg>
  </section>

  <!-- Calendar / Pomodoro (always right) -->
  <section class="card calcard" aria-label="Calendar and Pomodoro">
    <div class="cal" id="cal" data-view="cal" data-mode="focus">

      <div class="cal-head">
        <div class="titlebox">
          <div class="only-cal"><span class="month" id="month" title="Back to today"></span><span class="year" id="year"></span></div>
          <div class="chips only-pomo" id="chips">
            <button data-m="focus">Focus</button>
            <button data-m="short">Short</button>
            <button data-m="long">Long</button>
          </div>
        </div>
        <div class="tools">
          <div class="nav only-cal">
            <button class="ic" id="prev" aria-label="Previous month">‹</button>
            <button class="ic" id="next" aria-label="Next month">›</button>
          </div>
          <button class="ic" id="viewBtn" aria-label="Switch calendar / pomodoro"></button>
          <button class="ic" id="themeBtn" aria-label="Switch theme"></button>
        </div>
      </div>

      <!-- Calendar view -->
      <div class="calbody only-cal">
        <div class="dow" id="dow"></div>
        <div class="grid" id="grid"></div>
      </div>

      <!-- Pomodoro view -->
      <div class="pomo only-pomo">
        <div class="ringrow">
        <button class="adj" id="minus" aria-label="Subtract 5 minutes" title="−5 min">−5</button>
        <div class="ringwrap">
          <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-label="Pomodoro timer">
            <circle class="ring-track" cx="50" cy="50" r="42"/>
            <circle class="ring-prog" id="prog" cx="50" cy="50" r="42" transform="rotate(-90 50 50)"/>
            <text class="lbl" id="plabel" x="50" y="35">FOCUS</text>
            <text class="time" id="ptime" x="50" y="50">25:00</text>
            <g id="dots"></g>
          </svg>
        </div>
        <button class="adj" id="plus" aria-label="Add 5 minutes" title="+5 min">+5</button>
        </div>
        <div class="ctrls">
          <button class="cbtn" id="reset" aria-label="Reset"></button>
          <button class="cbtn main" id="play" aria-label="Start / pause"></button>
          <button class="cbtn" id="skip" aria-label="Skip"></button>
        </div>
      </div>

    </div>
  </section>

</div>

<script>
/* ===================== CONFIG — edit me ===================== */
const P = new URLSearchParams(location.search);
/* URL options (add to the embed link):
   ?theme=auto|light|dark   ?week=0|1   ?tz=Asia/Phnom_Penh   ?view=pomodoro
   ?focus=25&short=5&long=15   ?auto=1 (auto-start next session)   ?sound=0 (mute)       */
const CONFIG = {
  timeZone: P.get("tz") || null,                  // null = device time zone
  weekStart: P.has("week") ? +P.get("week") : 0,  // 0 = Sunday, 1 = Monday
  theme: P.get("theme") || "auto",                // default theme: "auto" | "light" | "dark"
  view: /^pomo/.test(P.get("view") || "") ? "pomo" : "cal",
  focus: +P.get("focus") || 25,                   // minutes
  short: +P.get("short") || 5,
  long: +P.get("long") || 15,
  longEvery: 4,                                   // long break after this many focus sessions
  autoStart: P.get("auto") === "1",
  sound: P.get("sound") !== "0",
  locale: undefined                               // e.g. "en-GB"
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

let TZ = CONFIG.timeZone || undefined;
try { new Intl.DateTimeFormat("en-US", { timeZone: TZ }); } catch (e) { TZ = undefined; }

/* ---------- Icons ---------- */
const ICON = {
  timer:    '<svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 2.5h4"/></svg>',
  calendar: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M4 10.5h16M8.5 3v4M15.5 3v4"/></svg>',
  auto:     '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
  light:    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  dark:     '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  play:  '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  reset: '<svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>',
  skip:  '<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2.2v12H16z"/></svg>'
};
$("reset").innerHTML = ICON.reset;
$("skip").innerHTML = ICON.skip;

/* ---------- Theme: auto / light / dark (saved) ---------- */
const THEMES = ["auto", "light", "dark"];
const mq = window.matchMedia("(prefers-color-scheme: dark)");
let themeMode = THEMES.includes(store.get("cw_theme")) ? store.get("cw_theme") : (THEMES.includes(CONFIG.theme) ? CONFIG.theme : "auto");
function applyTheme() {
  const light = themeMode === "light" || (themeMode === "auto" && !mq.matches);
  document.documentElement.classList.toggle("light", light);
  $("themeBtn").innerHTML = ICON[themeMode];
  $("themeBtn").title = "Theme: " + themeMode;
}
$("themeBtn").onclick = () => {
  themeMode = THEMES[(THEMES.indexOf(themeMode) + 1) % THEMES.length];
  store.set("cw_theme", themeMode);
  applyTheme();
};
if (mq.addEventListener) mq.addEventListener("change", applyTheme);
applyTheme();

/* ---------- Switch between Calendar and Pomodoro (saved) ---------- */
let ui = ["cal", "pomo"].includes(store.get("cw_view")) ? store.get("cw_view") : CONFIG.view;
function setUI(v) {
  ui = v;
  $("cal").dataset.view = v;
  $("viewBtn").innerHTML = v === "cal" ? ICON.timer : ICON.calendar;
  $("viewBtn").title = v === "cal" ? "Pomodoro timer" : "Calendar";
  store.set("cw_view", v);
  if (v === "pomo") pomoRender(true);
}
$("viewBtn").onclick = () => setUI(ui === "cal" ? "pomo" : "cal");

/* ---------- Clock face ---------- */
(function buildFace() {
  const ticks = $("ticks"), nums = $("nums");
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const a = i * 6 * Math.PI / 180;
    const r1 = major ? 45 : 46.5, r2 = 49;
    const l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 50 + r1 * Math.sin(a)); l.setAttribute("y1", 50 - r1 * Math.cos(a));
    l.setAttribute("x2", 50 + r2 * Math.sin(a)); l.setAttribute("y2", 50 - r2 * Math.cos(a));
    l.setAttribute("stroke", "var(--tick)");
    l.setAttribute("stroke-width", major ? 1.2 : 0.5);
    l.setAttribute("stroke-linecap", "round");
    ticks.appendChild(l);
  }
  for (let n = 1; n <= 12; n++) {
    const a = n * 30 * Math.PI / 180;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", 50 + 35.5 * Math.sin(a));
    t.setAttribute("y", 50 - 35.5 * Math.cos(a));
    t.setAttribute("class", "num");
    t.textContent = n;
    nums.appendChild(t);
  }
})();

/* ---------- Time helpers ---------- */
const fmtParts = new Intl.DateTimeFormat("en-US", {
  timeZone: TZ, year: "numeric", month: "numeric", day: "numeric",
  hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23"
});
function now() {
  const d = new Date(), p = {};
  fmtParts.formatToParts(d).forEach(x => { if (x.type !== "literal") p[x.type] = +x.value; });
  p.ms = d.getMilliseconds();
  return p;
}

/* ---------- Calendar ---------- */
let today = now();
let cur = { y: today.year, m: today.month - 1 };
let viewingToday = true;

function renderCalendar() {
  const first = new Date(Date.UTC(cur.y, cur.m, 1));
  const offset = (first.getUTCDay() - CONFIG.weekStart + 7) % 7;
  const days = new Date(Date.UTC(cur.y, cur.m + 1, 0)).getUTCDate();
  const rows = Math.ceil((offset + days) / 7);

  $("month").textContent = new Intl.DateTimeFormat(CONFIG.locale, { timeZone: "UTC", month: "long" }).format(first);
  $("year").textContent = cur.y;

  const letters = ["S", "M", "T", "W", "T", "F", "S"];
  let dow = "";
  for (let i = 0; i < 7; i++) dow += `<div>${letters[(CONFIG.weekStart + i) % 7]}</div>`;
  $("dow").innerHTML = dow;

  let html = "";
  for (let i = 0; i < offset; i++) html += `<div class="cell"></div>`;
  for (let d = 1; d <= days; d++) {
    const idx = (CONFIG.weekStart + (offset + d - 1) % 7) % 7;
    const isToday = cur.y === today.year && cur.m === today.month - 1 && d === today.day;
    html += `<div class="cell${idx === 0 || idx === 6 ? " we" : ""}${isToday ? " today" : ""}"><span>${d}</span></div>`;
  }
  const g = $("grid");
  g.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
  g.innerHTML = html;
}
function shiftMonth(n) {
  const d = new Date(Date.UTC(cur.y, cur.m + n, 1));
  cur = { y: d.getUTCFullYear(), m: d.getUTCMonth() };
  viewingToday = cur.y === today.year && cur.m === today.month - 1;
  renderCalendar();
}
function goToday() {
  cur = { y: today.year, m: today.month - 1 };
  viewingToday = true;
  renderCalendar();
}
$("prev").onclick = () => shiftMonth(-1);
$("next").onclick = () => shiftMonth(1);
$("month").onclick = goToday;

/* Touch (calendar view only): swipe left/right = change month, double-tap = today */
(function touch() {
  const el = $("cal");
  let sx = 0, sy = 0, tracking = false, lastTap = 0;
  el.addEventListener("touchstart", e => {
    if (ui !== "cal" || e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  el.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      shiftMonth(dx < 0 ? 1 : -1);
    } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && !e.target.closest("button")) {
      const n = Date.now();
      if (n - lastTap < 350) goToday();
      lastTap = n;
    }
  }, { passive: true });
})();

/* ---------- Pomodoro ---------- */
const DUR = { focus: CONFIG.focus * 60, short: CONFIG.short * 60, long: CONFIG.long * 60 };
const LABEL = { focus: "FOCUS", short: "SHORT BREAK", long: "LONG BREAK" };
const RING = 2 * Math.PI * 42;
const KEY = "cw_pomo_v1";

let S = (function load() {
  let s = null;
  try { s = JSON.parse(store.get(KEY) || "null"); } catch (e) {}
  if (!s || !DUR[s.mode]) s = { mode: "focus", running: false, endAt: 0, left: DUR.focus, total: DUR.focus, done: 0 };
  s.total = Number.isFinite(s.total) && s.total > 0 ? s.total : DUR[s.mode];
  s.left = Number.isFinite(s.left) ? Math.min(s.left, s.total) : s.total;
  s.done = Number.isFinite(s.done) ? s.done : 0;
  if (s.running && !(s.endAt > 0)) s.running = false;
  return s;
})();
const save = () => store.set(KEY, JSON.stringify(S));

/* Dots (progress towards the long break) */
(function buildDots() {
  const g = $("dots"), n = CONFIG.longEvery, gap = 6;
  for (let i = 0; i < n; i++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("class", "dot");
    c.setAttribute("cx", 50 + (i - (n - 1) / 2) * gap);
    c.setAttribute("cy", 66);
    c.setAttribute("r", 1.8);
    g.appendChild(c);
  }
})();
$("prog").setAttribute("stroke-dasharray", RING.toFixed(2));

/* Sound (the audio context is unlocked by the first tap on Start) */
let actx = null;
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function beep() {
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  if (!CONFIG.sound) return;
  try {
    unlockAudio();
    const t0 = actx.currentTime;
    [0, .25, .5].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + d + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + .22);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + .25);
    });
  } catch (e) {}
}

function setMode(m, autoStart) {
  S.mode = m; S.left = DUR[m]; S.total = DUR[m]; S.running = false; S.endAt = 0;
  if (autoStart) startTimer(); else save();
  pomoRender(true);
}
function startTimer() {
  unlockAudio();
  if (S.left <= 0) S.left = S.total;
  S.running = true; S.endAt = Date.now() + S.left * 1000;
  save(); pomoRender(true);
}
function pauseTimer() {
  S.left = Math.max(0, Math.ceil((S.endAt - Date.now()) / 1000));
  S.running = false; S.endAt = 0;
  save(); pomoRender(true);
}
function complete(silent) {
  if (!silent) beep();
  let next;
  if (S.mode === "focus") { S.done++; next = S.done % CONFIG.longEvery === 0 ? "long" : "short"; }
  else next = "focus";
  setMode(next, CONFIG.autoStart);
}

$("play").onclick = () => (S.running ? pauseTimer() : startTimer());
$("reset").onclick = () => { S.left = DUR[S.mode]; S.total = DUR[S.mode]; S.running = false; S.endAt = 0; save(); pomoRender(true); };

/* +5 / −5 minutes on the current session (works while running or paused; min 1 min, max 180 min) */
function adjust(deltaSec) {
  const rem = S.running ? Math.max(0, Math.ceil((S.endAt - Date.now()) / 1000)) : S.left;
  let nr = rem + deltaSec;
  if (deltaSec < 0) { if (rem <= 60) return; nr = Math.max(60, nr); }
  else { nr = Math.min(180 * 60, nr); if (nr <= rem) return; }
  const d = nr - rem;
  S.total = Math.max(60, S.total + d);
  if (S.running) S.endAt += d * 1000; else S.left = nr;
  save(); pomoRender(true);
}
$("minus").onclick = () => adjust(-300);
$("plus").onclick = () => adjust(300);
$("skip").onclick = () => setMode(S.mode === "focus" ? "short" : "focus", false);
$("chips").addEventListener("click", e => {
  const b = e.target.closest("button[data-m]");
  if (b) setMode(b.dataset.m, false);
});

let lastShown = "", lastRunning = null, lastMode = null, lastDots = -1;
function pomoRender(force) {
  const total = S.total * 1000;
  const ms = S.running ? Math.max(0, S.endAt - Date.now()) : S.left * 1000;
  const secs = Math.ceil(ms / 1000);
  const txt = String(Math.floor(secs / 60)).padStart(2, "0") + ":" + String(secs % 60).padStart(2, "0");

  if (txt !== lastShown || force) {
    lastShown = txt;
    $("ptime").textContent = txt;
    $("prog").style.strokeDashoffset = (RING * (1 - Math.min(1, ms / total))).toFixed(2);
  } else {
    $("prog").style.strokeDashoffset = (RING * (1 - Math.min(1, ms / total))).toFixed(2);
  }
  if (S.running !== lastRunning || force) {
    lastRunning = S.running;
    $("play").innerHTML = S.running ? ICON.pause : ICON.play;
  }
  if (S.mode !== lastMode || force) {
    lastMode = S.mode;
    $("cal").dataset.mode = S.mode;
    $("plabel").textContent = LABEL[S.mode];
    document.querySelectorAll("#chips button").forEach(b => b.classList.toggle("on", b.dataset.m === S.mode));
  }
  let n = S.done % CONFIG.longEvery;
  if (n === 0 && S.done > 0 && S.mode === "long") n = CONFIG.longEvery;
  if (n !== lastDots || force) {
    lastDots = n;
    [...$("dots").children].forEach((c, i) => c.classList.toggle("on", i < n));
  }
}

/* Keep time accurate even when the page was in the background or closed */
if (S.running && Date.now() >= S.endAt) complete(Date.now() - S.endAt > 3000);
setInterval(() => {
  if (S.running && Date.now() >= S.endAt) complete(false);
  if (ui === "pomo") pomoRender(false);
}, 250);

/* ---------- Clock animation loop ---------- */
let lastDayKey = "", rafId = 0;
function tick() {
  const t = now();
  const sec = t.second + t.ms / 1000;
  const min = t.minute + sec / 60;
  const hr = (t.hour % 12) + min / 60;
  $("sh").setAttribute("transform", `rotate(${sec * 6} 50 50)`);
  $("mh").setAttribute("transform", `rotate(${min * 6} 50 50)`);
  $("hh").setAttribute("transform", `rotate(${hr * 30} 50 50)`);

  const key = `${t.year}-${t.month}-${t.day}`;
  if (key !== lastDayKey) {
    lastDayKey = key;
    today = t;
    if (viewingToday) cur = { y: t.year, m: t.month - 1 };
    renderCalendar();
  }
  rafId = requestAnimationFrame(tick);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) cancelAnimationFrame(rafId);
  else { rafId = requestAnimationFrame(tick); pomoRender(true); }
});

/* ---------- Start ---------- */
renderCalendar();
setUI(ui);
pomoRender(true);
rafId = requestAnimationFrame(tick);
</script>
</body>
