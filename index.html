<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Clock Calendar</title>
<style>
  /* Layout: analog clock + digital readout on the left, Monday-first month grid on the right; stacks on phones. */
  :root {
    --bg: #ffffff;
    --surface-2: #f7f7f5;
    --text: #37352f;
    --muted: #8a8884;
    --border: rgba(55, 53, 47, 0.12);
    --accent: #37352f;
    --accent-text: #ffffff;
    --shadow: 0 1px 2px rgba(15, 15, 15, 0.05), 0 4px 14px rgba(15, 15, 15, 0.04);
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --font-num: "SF Pro Rounded", ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2b2b2d;
      --surface-2: #343436;
      --text: #ececec;
      --muted: #8e8e93;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #ececec;
      --accent-text: #2b2b2d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(0, 0, 0, 0.2);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2b2b2d;
    --surface-2: #343436;
    --text: #ececec;
    --muted: #8e8e93;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #ececec;
    --accent-text: #2b2b2d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(0, 0, 0, 0.2);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    padding: 0;
    -webkit-font-smoothing: antialiased;
    transition: background .25s, color .25s;
  }

  /* Edge-to-edge: no outer margin, border, radius or shadow, so it blends into the Notion page. */
  .widget {
    width: 100%; margin: 0; background: var(--bg);
    border: 0; border-radius: 0; box-shadow: none; padding: 16px;
    position: relative;
    display: grid; grid-template-columns: 1fr 1.15fr; gap: 24px; align-items: center;
  }
  .widget > section { min-width: 0; }
  @media (max-width: 560px) { .widget { grid-template-columns: 1fr; } }

  .toggle {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px;
    border-radius: 8px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; display: grid; place-items: center;
    font-size: 14px; transition: background .15s, color .15s; z-index: 2;
  }
  .toggle:hover { background: var(--surface-2); color: var(--text); }
  .toggle:focus-visible, .nav button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .clock-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .analog { width: min(100%, 210px); aspect-ratio: 1; }
  .face { fill: var(--surface-2); stroke: var(--border); stroke-width: 1.5; }
  .tick { stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; }
  .tick.major { stroke: var(--text); stroke-width: 2.5; }
  .hand { stroke-linecap: round; }
  .hand.h { stroke: var(--text); stroke-width: 4.5; }
  .hand.m { stroke: var(--text); stroke-width: 3; }
  .hand.s { stroke: var(--muted); stroke-width: 1.5; }
  .pivot { fill: var(--text); }
  .digital { text-align: center; }
  .time { font-family: var(--font-num); font-size: 2.1rem; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .time small { font-size: .95rem; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .date { margin-top: 2px; font-size: .9rem; color: var(--muted); }

  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; padding-right: 34px; }
  .cal-title { font-family: var(--font-num); font-size: 1.1rem; font-weight: 600; }
  .cal-title span { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .nav { display: flex; gap: 4px; }
  .nav button {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 7px; height: 28px; min-width: 28px; padding: 0 8px; cursor: pointer;
    font: inherit; font-size: .8rem; transition: background .15s;
  }
  .nav button:hover { background: var(--surface-2); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .dow { font-size: .7rem; color: var(--muted); padding: 6px 0; text-transform: uppercase; letter-spacing: .04em; }
  .day {
    font-family: var(--font-num); aspect-ratio: 1.15; display: grid; place-items: center; font-size: .85rem;
    border-radius: 8px; font-variant-numeric: tabular-nums;
  }
  .day.out { color: var(--muted); opacity: .45; }
  .day.today { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .day:not(.today):not(.out):hover { background: var(--surface-2); }

  @media (max-width: 560px) {
    .widget { grid-template-columns: 1fr; gap: 14px; padding: 14px; }
    /* Compact phone layout: small clock beside the digital time, shorter calendar cells, bigger tap targets. */
    .clock-wrap { flex-direction: row; justify-content: center; gap: 16px; }
    .analog { width: 116px; flex: none; }
    .digital { text-align: left; min-width: 0; }
    .time { font-size: 1.75rem; }
    .time small { font-size: .8rem; }
    .date { font-size: .8rem; }
    .cal-head { padding-right: 0; }
    .nav button { height: 36px; min-width: 36px; font-size: .9rem; }
    .toggle { top: 8px; right: 8px; width: 36px; height: 36px; }
    .day { aspect-ratio: 1.3; font-size: .9rem; }
  }
  @media (max-width: 560px) and (hover: none) { .day:not(.today):not(.out):hover { background: transparent; } }
</style>
</head>
<body>

<div class="widget" id="widget">
  <button class="toggle" id="toggle" title="Toggle light / dark" aria-label="Toggle theme">◐</button>

  <section class="clock-wrap">
    <svg class="analog" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="face" cx="100" cy="100" r="94"/>
      <g id="ticks"></g>
      <line class="hand h" id="hh" x1="100" y1="100" x2="100" y2="58"/>
      <line class="hand m" id="mh" x1="100" y1="100" x2="100" y2="38"/>
      <line class="hand s" id="sh" x1="100" y1="112" x2="100" y2="30"/>
      <circle class="pivot" cx="100" cy="100" r="4.5"/>
    </svg>
    <div class="digital">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="date"></div>
    </div>
  </section>

  <section>
    <div class="cal-head">
      <div class="cal-title" id="calTitle"></div>
      <div class="nav">
        <button id="prev" aria-label="Previous month">‹</button>
        <button id="todayBtn">Today</button>
        <button id="next" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
(function () {
  // Theme: follows the system unless the viewer toggles (or ?theme=dark|light is set).
  var root = document.documentElement;
  var params = new URLSearchParams(location.search);
  var saved = null;
  try { saved = localStorage.getItem('cc-theme'); } catch (e) {}
  var forced = params.get('theme') || saved;
  if (forced === 'dark' || forced === 'light') root.setAttribute('data-theme', forced);
  document.getElementById('toggle').onclick = function () {
    var isDark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('cc-theme', next); } catch (e) {}
  };

  var ticks = document.getElementById('ticks'), NS = 'http://www.w3.org/2000/svg';
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0, a = i * 6 * Math.PI / 180;
    var r1 = major ? 76 : 82, r2 = 88;
    var l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 100 + r1 * Math.sin(a)); l.setAttribute('y1', 100 - r1 * Math.cos(a));
    l.setAttribute('x2', 100 + r2 * Math.sin(a)); l.setAttribute('y2', 100 - r2 * Math.cos(a));
    l.setAttribute('class', 'tick' + (major ? ' major' : ''));
    ticks.appendChild(l);
  }

  var hh = document.getElementById('hh'), mh = document.getElementById('mh'), sh = document.getElementById('sh');
  var timeEl = document.getElementById('time'), dateEl = document.getElementById('date');
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  function rot(el, deg) { el.setAttribute('transform', 'rotate(' + deg + ' 100 100)'); }

  var viewY, viewM, lastDay = -1;
  var gridEl = document.getElementById('grid'), titleEl = document.getElementById('calTitle');
  var DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function renderCal() {
    var now = new Date(), html = '';
    DOW.forEach(function (d) { html += '<div class="dow">' + d + '</div>'; });
    var first = new Date(viewY, viewM, 1);
    var offset = (first.getDay() + 6) % 7;
    var start = new Date(viewY, viewM, 1 - offset);
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var cls = 'day';
      if (d.getMonth() !== viewM) cls += ' out';
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) cls += ' today';
      html += '<div class="' + cls + '">' + d.getDate() + '</div>';
    }
    gridEl.innerHTML = html;
    titleEl.innerHTML = MONTHS[viewM] + '<span>' + viewY + '</span>';
  }
  function goToday() { var n = new Date(); viewY = n.getFullYear(); viewM = n.getMonth(); renderCal(); }
  function shift(n) { var d = new Date(viewY, viewM + n, 1); viewY = d.getFullYear(); viewM = d.getMonth(); renderCal(); }
  document.getElementById('prev').onclick = function () { shift(-1); };
  document.getElementById('next').onclick = function () { shift(1); };
  document.getElementById('todayBtn').onclick = goToday;

  function tick() {
    var n = new Date(), h = n.getHours(), m = n.getMinutes(), s = n.getSeconds(), ms = n.getMilliseconds();
    rot(sh, (s + ms / 1000) * 6);
    rot(mh, (m + s / 60) * 6);
    rot(hh, ((h % 12) + m / 60) * 30);
    var h12 = h % 12 || 12;
    timeEl.innerHTML = pad(h12) + ':' + pad(m) + ':' + pad(s) + '<small>' + (h >= 12 ? 'PM' : 'AM') + '</small>';
    dateEl.textContent = n.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    if (n.getDate() !== lastDay) { lastDay = n.getDate(); renderCal(); }
    requestAnimationFrame(tick);
  }
  goToday();
  tick();
})();
</script>

</body>
</html>
